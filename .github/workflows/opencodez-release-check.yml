name: opencodez release check

on:
  schedule:
    # GitHub cron is UTC. This runs on the 1st, 12th and 23rd at 01:00 UTC
    # (09:00 in China). It is roughly every 11 days, not an exact interval.
    - cron: "0 1 */11 * *"
  workflow_dispatch:
    inputs:
      base:
        description: Base tag override (vX.Y.Z). Empty uses the current branch minus -z.
        required: false
        type: string
      dry_run:
        description: Check only; do not close or create issues.
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

concurrency:
  group: opencodez-release-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_INPUT: ${{ github.event.inputs.base }}
      DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check upstream releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE="${BASE_INPUT:-${GITHUB_REF_NAME%-z}}"
          node script/fork/check-release.mjs --base "$BASE" --json > "$RUNNER_TEMP/check.json"
          cat "$RUNNER_TEMP/check.json"

      - name: Notify by issue
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          DRY_RUN="false"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            DRY_RUN="${DRY_RUN_INPUT:-true}"
          fi
          node script/fork/release-notify.mjs "$RUNNER_TEMP/check.json" --dry-run="$DRY_RUN"
